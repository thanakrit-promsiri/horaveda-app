name: Go CI & SonarCloud

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "main", "master", "develop" ]

jobs:
  test-and-sonar:
    name: Test, Coverage & SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # จำเป็นสำหรับ SonarCloud เพื่อให้วิเคราะห์ Blame / New Code ได้ครบถ้วน

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests & generate coverage.out + test-report.json
        run: |
          go test -v -race -count=1 -coverpkg=./internal/...,./pkg/... -covermode=atomic -coverprofile=coverage.raw.out -json ./... > test-report.json
          sed 's|^horaveda-app/||' coverage.raw.out > coverage.out
          head -n 20 coverage.out

      - name: Display coverage summary
        run: go tool cover -func=coverage.raw.out

      - name: Build server binary
        run: go build -v -o bin/server ./cmd/server/main.go

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@e805d87e00fa71f762744cc1011812837bc902fa # v8.4.1
        with:
          args: >
            -Dsonar.projectKey=thanakrit-promsiri_horaveda-app
            -Dsonar.organization=thanakrit-promsiri
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.go.tests.reportPaths=test-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
