# SonarCloud Configuration for horaveda-app
sonar.organization=thanakrit-promsiri
sonar.projectKey=thanakrit-promsiri_horaveda-app
sonar.projectName=horaveda-app

# Source & Test Directories
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/logs/**,**/*.json,migrations/**,bin/**
sonar.coverage.exclusions=cmd/server/main.go,internal/domain/model.go
sonar.cpd.exclusions=**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go Test Coverage Report Path
sonar.go.coverage.reportPaths=coverage.out
