# ==============================================================================
# SonarCloud Configuration for Horaveda App (Go)
# Repository: https://github.com/thanakrit-promsiri/horaveda-app
# ==============================================================================

sonar.projectKey=thanakrit-promsiri_horaveda-app
sonar.organization=thanakrit-promsiri
sonar.projectName=horaveda-app

# โฟลเดอร์ซอร์สโค้ดทั้งหมด
sonar.sources=internal,pkg

# แยกไฟล์เทสต์ออกจากโค้ดหลัก เพื่อให้คำนวณ Coverage ได้ถูกต้อง
sonar.tests=internal,pkg
sonar.test.inclusions=**/*_test.go

# ยกเว้นไฟล์เทสต์ออกจากตัวหารของโค้ดหลัก (สำคัญ: ห้ามใส่ **/*_test.go ใน sonar.exclusions เพราะจะทำให้ SonarCloud ข้ามการอ่าน Test)
sonar.exclusions=vendor/**,logs/**,req/**,migrations/**,bin/**
sonar.coverage.exclusions=**/*_test.go,internal/domain/model.go
sonar.cpd.exclusions=**/*_test.go

# ระบุไฟล์รายงานผล Test Coverage และผลการรันเทสต์ของ Go
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.json

sonar.sourceEncoding=UTF-8
